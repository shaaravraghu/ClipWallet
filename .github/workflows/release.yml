name: Build and upload release assets

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-13-arm64

    env:
      SKIP_CODESIGN: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install additional tools
        run: |
          rustup target list --installed || true

      - name: Cargo fmt check
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --release

      - name: Build & package
        run: |
          chmod +x ./build_release.sh
          ./build_release.sh

      - name: List dist
        run: ls -la dist || true

      - name: Upload release assets (zip, per-arch binary, install.sh)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          echo "Uploading release assets to $UPLOAD_URL"

          # Upload top-level artifacts (zip + per-arch binary)
          for f in dist/*-${TARGET}*; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading $name"
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" "${UPLOAD_URL}?name=${name}" || exit 1
          done

          # Upload installer script from inside the packaged folder as 'install.sh'
          if [ -f "dist/clipwallet/install.sh" ]; then
            echo "Uploading install.sh"
            curl -s -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @dist/clipwallet/install.sh "${UPLOAD_URL}?name=install.sh" || exit 1
          else
            echo "Warning: dist/clipwallet/install.sh not found — skipping upload of install.sh"
          fi
