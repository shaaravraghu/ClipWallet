name: "✨ Enhancement"
description: Propose a new feature or enhancement for ClipWallet.
title: "[Enhancement]: "
labels: ["enhancement", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Have an idea that would make ClipWallet better? We'd love to hear it!
        
        Before submitting, please check the [open issues](https://github.com/shaaravraghu/ClipWallet/issues) and [ROADMAP.md](../ROADMAP.md) to see if this is already planned or discussed.

  - type: textarea
    id: problem
    attributes:
      label: "What problem does this solve?"
      description: "Describe the workflow pain point or limitation this feature would address. Good features start with a real problem, not a solution."
      placeholder: "Right now, there's no way to search across all clipboard slots. When I have 9 slots full, I have to paste each one to find what I'm looking for, which is slow..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed solution"
      description: "Describe what you'd like to happen. Be as specific as you can — hotkey chords, CLI commands, output format, etc."
      placeholder: "Add a `clipwallet search <query>` command that prints matching slot contents with their slot numbers. Fuzzy matching would be ideal. An optional hotkey chord (e.g. Cmd+Opt+F) could trigger an interactive search mode..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Have you tried any workarounds or considered other approaches? Why didn't they work for you?"
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: "Which area of ClipWallet does this affect?"
      options:
        - "Hotkey / chord system"
        - "Static mode (9 slots)"
        - "Dynamic mode (ring buffer)"
        - "Storage / persistence"
        - "Encryption / Vault"
        - "CLI commands"
        - "Installation / setup"
        - "Daemon / launchd service"
        - "Rich data types (images, RTF, files)"
        - "Cross-platform support"
        - "Documentation"
        - "Other / not sure"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "How important is this to your workflow?"
      options:
        - "Nice to have"
        - "Would significantly improve my daily use"
        - "Blocking — I can't use ClipWallet without this"
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: "Implementation notes (optional)"
      description: "If you have thoughts on how this could be implemented in the codebase, share them here. Not required — just helpful for discussion."
      placeholder: "This could live in a new `src/search.rs` module, iterating over the `StaticStore` and `RingBuffer` structs..."
    validations:
      required: false

  - type: checkboxes
    id: willing-to-contribute
    attributes:
      label: "Contribution"
      options:
        - label: "I'm willing to open a PR to implement this feature."
          required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Before submitting"
      options:
        - label: "I have checked existing issues and the ROADMAP — this is not already planned."
          required: true
        - label: "This feature is specific to ClipWallet and not a general macOS clipboard request."
          required: true