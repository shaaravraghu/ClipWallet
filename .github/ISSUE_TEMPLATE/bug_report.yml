name: "🐛 Bug Report"
description: Something isn't working as expected in ClipWallet.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! The more detail you provide, the faster we can reproduce and fix it.
        
        > **Security issue?** Please do **not** open a public issue. Follow the process in [SECURITY.md](../SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: "What happened?"
      description: "A clear and concise description of the bug."
      placeholder: "When I press Cmd+Opt+V+1, ClipWallet pastes the wrong slot contents..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What did you expect to happen?"
      placeholder: "Slot 1 contents should have been pasted."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: "Provide a minimal, reliable set of steps."
      placeholder: |
        1. Start ClipWallet daemon with `clipwallet run`
        2. Copy text A, then save to slot 1 with Cmd+Opt+C+1
        3. Copy text B, then save to slot 2 with Cmd+Opt+C+2
        4. Paste slot 1 with Cmd+Opt+V+1
        5. Observe that text B is pasted instead of text A
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: "ClipWallet version"
      description: "Run `clipwallet --version` to find this."
      placeholder: "e.g. 0.1.0"
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: "macOS version"
      description: "Found in Apple menu → About This Mac."
      placeholder: "e.g. macOS 14.4 Sonoma"
    validations:
      required: true

  - type: input
    id: rust-version
    attributes:
      label: "Rust toolchain version (if building from source)"
      description: "Run `rustc --version`."
      placeholder: "e.g. rustc 1.78.0 (stable)"
    validations:
      required: false

  - type: dropdown
    id: install-method
    attributes:
      label: "How did you install ClipWallet?"
      options:
        - "install.sh script"
        - "Manual build from source (cargo build --release)"
        - "Pre-built binary from Releases page"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: "Which operating mode were you in when the bug occurred?"
      options:
        - "Static mode (9 addressed slots)"
        - "Dynamic mode (50-entry ring buffer)"
        - "Not sure / Not applicable"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Relevant log output"
      description: |
        Run ClipWallet with debug logging and paste any relevant output here.
        ```bash
        RUST_LOG=debug clipwallet run
        ```
      render: shell
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots or screen recordings"
      description: "If applicable, attach screenshots or a screen recording to help explain the problem."
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional context"
      description: "Anything else that might be relevant — other running apps, unusual system configuration, etc."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Before submitting"
      options:
        - label: "I have searched existing issues and this is not a duplicate."
          required: true
        - label: "I have reproduced this on the latest version of ClipWallet."
          required: true
        - label: "I have granted Accessibility permissions to ClipWallet (System Settings → Privacy & Security → Accessibility)."
          required: false